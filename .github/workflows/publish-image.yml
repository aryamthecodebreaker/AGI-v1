name: Publish container image

# Builds the Docker image and publishes it to GitHub Container Registry on every
# push to main, so there is always a runnable artifact of the current code.
#
# GitHub cannot host AGI-v1 itself — Pages serves static files only, and this
# needs a Node server, a WebSocket endpoint for device agents, a writable SQLite
# file and a server-side API key. What GitHub can do is build the image, which
# makes deploying it anywhere a single command:
#
#   docker run -p 7860:7860 \
#     -e GEMINI_API_KEY=... \
#     -e JWT_SECRET=... \
#     ghcr.io/<owner>/agi-v1:main
#
# The image runs the device gateway in-process, so that one container is the
# whole product: chat, memory, capabilities and AGI Command.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        # The registry requires a lowercase path; repository owners may not be.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo
            echo '```bash'
            echo "docker run -p 7860:7860 \\"
            echo "  -e GEMINI_API_KEY=your-key \\"
            echo "  -e JWT_SECRET=at-least-32-characters-long-secret \\"
            echo "  ${{ steps.image.outputs.name }}:main"
            echo '```'
            echo
            echo "Then open http://localhost:7860. AGI Command is enabled in the image and"
            echo "the device gateway runs in-process, so agents connect to ws://localhost:7860/agent."
          } >> "$GITHUB_STEP_SUMMARY"
